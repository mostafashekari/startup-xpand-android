name: Build verified signed APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Version name, for example 3.2.2
        required: true
        default: 3.2.2
        type: string
      version_code:
        description: Integer greater than installed v3.1 code 30100
        required: true
        default: '30202'
        type: string
  push:
    branches: [main]
    paths:
      - '.github/workflows/signed-release.yml'
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradlew'
      - 'gradle.properties'
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: startup-xpand-signed-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Gradle release build, sign and verify
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    env:
      VERSION_NAME: ${{ github.event.inputs.version_name || '3.2.2' }}
      VERSION_CODE: ${{ github.event.inputs.version_code || '30202' }}
      EXPECTED_PACKAGE: com.startupxpand.app
      EXPECTED_CERT_SHA256: 6191e224e27a60c11f3e399d4a10e20ad1487f9f1dc49f04c883aa4365f0f8ee

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        shell: bash
        run: |
          set -Eeuo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt"
          test -x "$ANDROID_HOME/build-tools/35.0.0/zipalign"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"

      - name: Install and cache Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate build environment
        shell: bash
        run: |
          set -Eeuo pipefail
          java -version
          gradle --version
          sdkmanager --list_installed

      - name: Validate and apply version
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]
          [[ "$VERSION_CODE" =~ ^[0-9]+$ ]]
          (( VERSION_CODE > 30100 ))

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path('app/build.gradle.kts')
          text = path.read_text(encoding='utf-8')
          text, code_changes = re.subn(
              r'versionCode\s*=\s*\d+',
              f'versionCode = {os.environ["VERSION_CODE"]}',
              text,
              count=1,
          )
          text, name_changes = re.subn(
              r'versionName\s*=\s*"[^"]+"',
              f'versionName = "{os.environ["VERSION_NAME"]}"',
              text,
              count=1,
          )
          if code_changes != 1 or name_changes != 1:
              raise SystemExit('Could not update versionCode/versionName')
          path.write_text(text, encoding='utf-8')
          PY

          grep -nE 'versionCode|versionName' app/build.gradle.kts

      - name: Gradle clean assembleRelease
        shell: bash
        run: |
          set -Eeuo pipefail
          gradle --no-daemon --stacktrace clean assembleRelease | tee "$RUNNER_TEMP/gradle-build.log"

      - name: Locate and inspect unsigned Release APK
        id: apk
        shell: bash
        run: |
          set -Eeuo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -s "$APK"
          echo "unsigned=$APK" >> "$GITHUB_OUTPUT"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 20

      - name: Detect signing Secret
        id: signing
        shell: bash
        env:
          SIGNING_BUNDLE_BASE64: ${{ secrets.ANDROID_SIGNING_BUNDLE_BASE64 }}
        run: |
          if [[ -n "$SIGNING_BUNDLE_BASE64" ]]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'ANDROID_SIGNING_BUNDLE_BASE64 is not configured.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Restore private signing material
        if: steps.signing.outputs.available == 'true'
        shell: bash
        env:
          SIGNING_BUNDLE_BASE64: ${{ secrets.ANDROID_SIGNING_BUNDLE_BASE64 }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$SIGNING_BUNDLE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.zip"
          unzip -q "$RUNNER_TEMP/signing.zip" -d "$RUNNER_TEMP/signing"
          test -s "$RUNNER_TEMP/signing/keystore/startup-xpand-release.jks"
          test -s "$RUNNER_TEMP/signing/keystore.properties"
          chmod 600 "$RUNNER_TEMP/signing/keystore/startup-xpand-release.jks"

      - name: Zipalign, sign and verify Release APK
        if: steps.signing.outputs.available == 'true'
        shell: bash
        env:
          UNSIGNED_APK: ${{ steps.apk.outputs.unsigned }}
        run: |
          set -Eeuo pipefail
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          PROPS="$RUNNER_TEMP/signing/keystore.properties"
          KEYSTORE="$RUNNER_TEMP/signing/keystore/startup-xpand-release.jks"
          STORE_PASSWORD="$(sed -n 's/^storePassword=//p' "$PROPS" | tr -d '\r')"
          KEY_ALIAS="$(sed -n 's/^keyAlias=//p' "$PROPS" | tr -d '\r')"
          KEY_PASSWORD="$(sed -n 's/^keyPassword=//p' "$PROPS" | tr -d '\r')"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

          mkdir -p dist
          ALIGNED="dist/app-release-aligned.apk"
          FINAL="dist/Startup-Xpand-Android-v${VERSION_NAME}-${VERSION_CODE}.apk"

          "$BUILD_TOOLS/zipalign" -p -f 4 "$UNSIGNED_APK" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-pass "pass:$STORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASSWORD" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$FINAL" \
            "$ALIGNED"

          "$BUILD_TOOLS/zipalign" -c -p 4 "$FINAL"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$FINAL" | tee dist/apksigner-verification.txt

          BADGING="$("$BUILD_TOOLS/aapt" dump badging "$FINAL" | head -n 1)"
          ACTUAL_PACKAGE="$(sed -n "s/.*package: name='\([^']*\)'.*/\1/p" <<< "$BADGING")"
          ACTUAL_VERSION_CODE="$(sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" <<< "$BADGING")"
          ACTUAL_VERSION_NAME="$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" <<< "$BADGING")"
          ACTUAL_CERT="$("$BUILD_TOOLS/apksigner" verify --print-certs "$FINAL" | awk -F': ' '/Signer #1 certificate SHA-256 digest/ {print $2; exit}' | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"

          [[ "$ACTUAL_PACKAGE" == "$EXPECTED_PACKAGE" ]]
          [[ "$ACTUAL_VERSION_CODE" == "$VERSION_CODE" ]]
          [[ "$ACTUAL_VERSION_NAME" == "$VERSION_NAME" ]]
          [[ "$ACTUAL_CERT" == "$EXPECTED_CERT_SHA256" ]]

          cp "$RUNNER_TEMP/gradle-build.log" dist/gradle-build.log
          rm -f "$ALIGNED"
          sha256sum "$FINAL" | tee dist/SHA256SUMS.txt

          {
            echo '## Signed APK verified'
            echo "- Package: $ACTUAL_PACKAGE"
            echo "- versionCode: $ACTUAL_VERSION_CODE"
            echo "- versionName: $ACTUAL_VERSION_NAME"
            echo "- Certificate SHA-256: $ACTUAL_CERT"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve unsigned output when Secret is absent
        if: steps.signing.outputs.available != 'true'
        shell: bash
        env:
          UNSIGNED_APK: ${{ steps.apk.outputs.unsigned }}
        run: |
          set -Eeuo pipefail
          mkdir -p unsigned-dist
          cp "$UNSIGNED_APK" unsigned-dist/
          cp "$RUNNER_TEMP/gradle-build.log" unsigned-dist/
          sha256sum unsigned-dist/*.apk > unsigned-dist/SHA256SUMS.txt

      - name: Upload verified signed APK
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Startup-Xpand-signed-v${{ env.VERSION_NAME }}-${{ env.VERSION_CODE }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Upload unsigned diagnostic APK
        if: steps.signing.outputs.available != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Startup-Xpand-unsigned-diagnostic
          path: unsigned-dist/
          if-no-files-found: error
          retention-days: 7
