name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Ensure Gradle Wrapper
        run: |
          if [ ! -f ./gradlew ]; then
            echo "gradlew missing — generating wrapper"
            gradle wrapper --gradle-version 8.9
          fi
          chmod +x ./gradlew
          ./gradlew --version

      - name: Accept Android licenses
        run: |
          mkdir -p "$ANDROID_SDK_ROOT/licenses"
          printf '24333f8a63b6825ea9c5514f83c2829b004d1fee\n' > "$ANDROID_SDK_ROOT/licenses/android-sdk-license"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Install platform & build-tools
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace --build-cache

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: StartupXpand-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
