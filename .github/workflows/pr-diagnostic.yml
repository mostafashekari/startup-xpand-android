name: PR Android build diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: |
          set -Eeuo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
          sdkmanager --list_installed
      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Gradle environment
        run: gradle --version
      - name: Clean release build
        run: gradle --no-daemon --stacktrace clean assembleRelease
      - name: Upload diagnostic APK
        uses: actions/upload-artifact@v4
        with:
          name: Startup-Xpand-PR-diagnostic
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
